name: Feature request
description: Describe a task Vaulto could help you complete.
title: "[Idea]: "
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe a concrete use case and what makes it difficult today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a useful result look like?
      description: Include any workaround you currently use. Please use fictional examples.
    validations:
      required: true
