<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Vaulto Note — Speak it. Keep it. Find it.</title>
  <desc id="desc">Private AI voice notes for Android. Voice to text, on-device AI, and optional encrypted sync.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1528"/><stop offset="1" stop-color="#142c52"/></linearGradient>
    <linearGradient id="wave" y2="1"><stop stop-color="#91d7ff"/><stop offset="1" stop-color="#448bff"/></linearGradient>
  </defs>
  <rect width="1200" height="430" rx="24" fill="#111f36"/>
  <circle cx="1040" cy="165" r="120" fill="#3063ac" opacity=".13"/>
  <circle cx="1040" cy="165" r="157" fill="none" stroke="#4886d2" opacity=".14"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="66" y="66" font-size="16" font-weight="700" letter-spacing="3" fill="#8dbae8">VAULTO NOTE</text>
    <text x="63" y="150" font-size="59" font-weight="700" fill="#f4f8ff">Speak it. Keep it.</text>
    <text x="63" y="218" font-size="59" font-weight="700" fill="#8dcaff">Find it.</text>
    <text x="66" y="270" font-size="23" fill="#bed0e7">Turn spoken thoughts into notes and next steps.</text>
    <text x="66" y="306" font-size="19" fill="#bed0e7">On-device AI. Your choice of local or cloud.</text>
    <g font-size="14" font-weight="700" fill="#d6e6ff">
