plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.vaultonotemobile'
version = '1.0.0'

android {
  namespace "expo.modules.inkinput"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Front-buffered rendering for the stroke under the pen (InkLiveView).
  implementation 'androidx.graphics:graphics-core:1.0.4'
  implementation 'androidx.input:input-motionprediction:1.0.0'
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
